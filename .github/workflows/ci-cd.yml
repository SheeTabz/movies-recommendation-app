name: CI/CD Pipeline

# Triggers: Run on pushes/PRs to development (CI only), pushes to production (full CI/CD)
on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]

jobs:
  # Job 1: CI Checks (lint, type-check, tests) - runs on all triggers
  ci-checks:
    runs-on: ubuntu-latest  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  
          cache: 'npm'  

      - name: Install dependencies
        run: npm ci  

      - name: Run linting
        run: npm run lint:check 

      - name: Type check
        run: npm run type-check 

      - name: Run unit tests
        run: npm run test 

      # - name: Run test coverage (optional, for reporting)
      #   if: github.event_name == 'pull_request'  # Only on PRs to save time
      #   run: npm run test:coverage

  # Job 2: Build & Deploy (only on push to production)
  deploy:
    needs: ci-checks  
    if: github.ref == 'refs/heads/production'  # Only on production push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

        
      - name: Trigger Netlify build (using build hook)
        run: curl -X POST -d '{}' ${{ secrets.NETLIFY_BUILD_HOOK_URL }}

      # - name: Deploy to Netlify
